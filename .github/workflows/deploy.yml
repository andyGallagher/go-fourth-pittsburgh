name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish] # fired by the Sanity webhook, see sanity.md
  workflow_dispatch:

# Rapid successive publishes only deploy the latest content
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            images/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Convert any Sanity images not yet on cdn.gofourthpittsburgh.org and upload them
      - name: Process new images
        working-directory: images
        run: |
          npm ci
          aws s3 ls s3://go-fourth-cdn/dist/ | awk '{print $4}' > existing.txt
          node fetch-images.js --new existing.txt
          aws s3 sync dist/ s3://go-fourth-cdn/dist/ --exclude "*" --include "*.webp" --content-type image/webp
          aws s3 sync dist/ s3://go-fourth-cdn/dist/ --exclude "*" --include "*.gif" --content-type image/gif

      - name: Build site
        working-directory: client
        run: |
          npm ci
          npm run static

      - name: Upload site
        working-directory: client
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} --paths "/*"
